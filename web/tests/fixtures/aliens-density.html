<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Two-pilot render cost fixture</title>
  <body style="margin: 0; background: #10212c">
    <div id="field"></div>
    <script type="module">
      import Phaser from "phaser";
      import oldSprinter from "../../art-source/expedition-1.0/sprinter-0.9.webp?url";
      import {
        ALIEN_ANIMATIONS,
        alienPose,
      } from "/src/game/alien-animation.ts";
      import { ENEMIES } from "/src/game/content.ts";
      const params = new URLSearchParams(location.search),
        before = params.get("variant") === "before",
        group = params.get("group") || "mixed";
      const kinds = group === "mixed" ? ["sprinter", "gargantua"] : [group];
      const count = 50,
        sprites = [],
        metrics = {
          ready: false,
          count,
          group,
          variant: before ? "0.9" : "1.0",
          frames: [],
          cpu: [],
          atlasInitMs: {},
          spriteInitMs: null,
          displayObjects: 0,
          textureCount: 0,
        };
      window.densityMetrics = metrics;
      const add = Phaser.Textures.TextureManager.prototype.addSpriteSheet;
      Phaser.Textures.TextureManager.prototype.addSpriteSheet = function (
        ...args
      ) {
        const start = performance.now(),
          result = add.apply(this, args);
        if (args[0].startsWith("expedition-"))
          metrics.atlasInitMs[args[0]] = performance.now() - start;
        return result;
      };
      let lastFrame = 0;
      class Density extends Phaser.Scene {
        preload() {
          for (const kind of kinds) {
            const sheet = ALIEN_ANIMATIONS[kind];
            if (before && kind === "gargantua")
              this.load.image(sheet.key, "/art/expedition/gargantua.webp");
            else
              this.load.spritesheet(
                sheet.key,
                before ? oldSprinter : "/art/" + sheet.file,
                { frameWidth: 160, frameHeight: 120 },
              );
          }
        }
        create() {
          const start = performance.now();
          this.add.rectangle(540, 330, 1080, 660, 0x142b36);
          for (let i = 0; i < count; i++) {
            const kind = kinds[i % kinds.length],
              sheet = ALIEN_ANIMATIONS[kind];
            sprites.push(
              this.add
                .sprite(0, 0, sheet.key)
                .setData("kind", kind)
                .setOrigin(
                  0.5,
                  before && kind === "gargantua" ? 273 / 280 : sheet.foot,
                ),
            );
          }
          metrics.displayObjects = this.children.length;
          metrics.spriteInitMs = performance.now() - start;
          metrics.textureCount = Object.keys(this.textures.list).length;
          metrics.ready = true;
        }
        update(time) {
          const start = performance.now(),
            elapsed = time / 1000,
            delta = lastFrame ? start - lastFrame : 0;
          for (let i = 0; i < count; i++) {
            const sprite = sprites[i],
              kind = sprite.getData("kind"),
              sheet = ALIEN_ANIMATIONS[kind],
              x = 10 - ((elapsed * ENEMIES[kind].speed + i * 0.197) % 10),
              attacking = i % 5 === 0;
            sprite.setPosition(40 + x * 100, 95 + (i % 6) * 95);
            if (before && kind === "gargantua")
              sprite
                .setDisplaySize(122, (122 * 280) / 384)
                .setY(
                  sprite.y + (attacking ? 0 : Math.sin(elapsed * 4 + i) * 0.7),
                )
                .setAngle(attacking ? 0 : Math.cos(elapsed * 4 + i) * 0.6);
            else {
              const pose = alienPose(
                kind,
                {
                  id: i,
                  x,
                  previousX: x + 0.05 * ENEMIES[kind].speed,
                  attacking,
                  cooldown:
                    ENEMIES[kind].cooldown - (elapsed % ENEMIES[kind].cooldown),
                },
                elapsed,
                1,
                false,
              );
              sprite
                .setFrame(pose.frame)
                .setDisplaySize(sheet.width, sheet.height);
            }
          }
          lastFrame = start;
          if (time > 2000 && metrics.frames.length < 1200) {
            metrics.frames.push(delta);
            metrics.cpu.push(performance.now() - start);
          }
        }
      }
      new Phaser.Game({
        type: Phaser.WEBGL,
        width: 1080,
        height: 660,
        parent: "field",
        banner: false,
        audio: { noAudio: true },
        scene: Density,
      });
    </script>
  </body>
</html>
