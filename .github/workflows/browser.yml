name: Browser game

on:
  push:
    branches: [modernization]
    paths: ['web/**', '.github/workflows/browser.yml']
  pull_request:
    branches: [modernization]
    paths: ['web/**', '.github/workflows/browser.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start virtual audio output
        run: |
          sudo apt-get install --no-install-recommends -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ava_test_audio rate=48000 channels=2
          pactl set-default-sink ava_test_audio
          pactl set-sink-mute ava_test_audio 0
          pactl set-sink-volume ava_test_audio 100%
          pactl info
      - run: npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2

      - name: Retain failed browser traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  expedition-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build:release
      - run: npm run verify:release:assets
      - run: node scripts/release/standalone-parity.cjs
      - name: Verify preserved animation and source
        run: |
          sudo apt-get install --no-install-recommends -y python3-pil
          /usr/bin/python3 scripts/release/verify-preservation.py
          /usr/bin/python3 scripts/test_animation_tools.py
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start virtual audio output
        run: |
          sudo apt-get install --no-install-recommends -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ava_test_audio rate=48000 channels=2
          pactl set-default-sink ava_test_audio
          pactl set-sink-mute ava_test_audio 0
          pactl set-sink-volume ava_test_audio 100%
      - name: Verify actual Expedition-only production journeys
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .release-verification/browser.json
        run: npm run test:release -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2 --reporter=line,json
      - name: Retain release verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-verification-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            web/.release-verification/inventory.json
            web/.release-verification/SHA256SUMS
            web/.release-verification/rights-inventory.json
            web/.release-verification/standalone-parity.json
            web/.release-verification/preservation.json
            web/.release-verification/browser.json
          retention-days: 14
          if-no-files-found: warn
      - name: Retain failed release traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-failure-${{ matrix.browser }}-${{ matrix.shard }}
          path: web/.release-verification/test-results/
          retention-days: 7
          if-no-files-found: ignore
